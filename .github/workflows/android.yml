name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache assembleDebug testDebugUnitTest --console=plain 2>&1 | tee build.log

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin ci-logs || true
          git switch --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp /tmp/build.log build.log
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git add -f build.log status.txt
          git commit -m "CI log for ${{ github.sha }}"
          git push -f origin ci-logs-tmp:ci-logs

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SongRecorder-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
